      <text x="270" y="330" font-family="Montserrat, Arial, sans-serif" font-size="13" fill="#68636A">Fondos suaves y superficies</text>
    
      <rect x="486" y="130" width="190" height="112" rx="18" fill="#111111" stroke="#E7E1E1" stroke-width="1"/>
      <text x="486" y="272" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="600" fill="#111111">Negro profundo</text>
      <text x="486" y="300" font-family="Montserrat, Arial, sans-serif" font-size="18" fill="#111111">#111111</text>
      <text x="486" y="330" font-family="Montserrat, Arial, sans-serif" font-size="13" fill="#68636A">Logo, títulos y texto principal</text>
    
      <rect x="702" y="130" width="190" height="112" rx="18" fill="#F7F4F2" stroke="#E7E1E1" stroke-width="1"/>
