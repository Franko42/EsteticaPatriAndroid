      <text x="918" y="330" font-family="Montserrat, Arial, sans-serif" font-size="13" fill="#68636A">Acentos secundarios</text>
    
<line x1="54" y1="365" x2="1066" y2="365" stroke="#E7E1E1"/>
<text x="54" y="408" font-family="Montserrat, Arial, sans-serif" font-size="30" font-weight="700" fill="#111111">Montserrat</text>
<text x="330" y="404" font-family="Montserrat, Arial, sans-serif" font-size="16" fill="#111111">Títulos: SemiBold / 600</text>
<text x="600" y="404" font-family="Montserrat, Arial, sans-serif" font-size="16" fill="#111111">Texto y botones: Regular / 400–500</text>
<text x="54" y="442" font-family="Montserrat, Arial, sans-serif" font-size="13" fill="#68636A">Alternativa de sistema: Arial. Para producción, cargar Montserrat desde archivos locales.</text>
