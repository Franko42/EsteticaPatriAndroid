      <text x="702" y="330" font-family="Montserrat, Arial, sans-serif" font-size="13" fill="#68636A">Fondo alternativo</text>
    
      <rect x="918" y="130" width="190" height="112" rx="18" fill="#E89CB0" stroke="#E7E1E1" stroke-width="1"/>
