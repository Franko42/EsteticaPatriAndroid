<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-labelledby="t d">
<title id="t">Paleta de colores y tipografía de la marca</title>
<desc id="d">Paleta rosa, rosa claro, negro profundo, marfil cálido y rosa suave. Tipografía recomendada: Montserrat.</desc>
<rect width="1120" height="470" rx="24" fill="#FFFFFF"/>
<text x="54" y="62" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="1" fill="#111111">IDENTIDAD VISUAL</text>
<text x="54" y="94" font-family="Montserrat, Arial, sans-serif" font-size="15" fill="#68636A">Paleta sugerida · valores HEX listos para la web y la app</text>

      <rect x="54" y="130" width="190" height="112" rx="18" fill="#FF9CAC" stroke="#E7E1E1" stroke-width="1"/>
      <text x="54" y="272" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="600" fill="#111111">Rosa principal</text>
      <text x="54" y="300" font-family="Montserrat, Arial, sans-serif" font-size="18" fill="#111111">#FF9CAC</text>
      <text x="54" y="330" font-family="Montserrat, Arial, sans-serif" font-size="13" fill="#68636A">Marca y elementos destacados</text>
    
      <rect x="270" y="130" width="190" height="112" rx="18" fill="#FFD6DC" stroke="#E7E1E1" stroke-width="1"/>
      <text x="270" y="272" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="600" fill="#111111">Rosa claro</text>
